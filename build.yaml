# Build configuration for code generation using build_runner
#
# This file configures the build_runner package to generate Dart code
# from various sources.
targets:
  $default:
    builders:
      # Enable Hive code generation and schema migration
      # hive_ce_generator|hive_schema_migrator:
      #   enabled: true

      # Configure json_serializable to skip custom annotated files
      json_serializable:
        generate_for:
          exclude:
            - lib/core/domain/failures/**
            - lib/core/infrastructure/exceptions/**
            - lib/modules/**/domain/failures/**
            - lib/modules/**/infrastructure/exceptions/**
            - lib/core/infrastructure/annotations/**
            - lib/core/infrastructure/mappers/problem_mapper.g.dart

      # Configure chopper_generator to skip custom annotated files
      chopper_generator:
        generate_for:
          exclude:
            - lib/core/domain/failures/**
            - lib/core/infrastructure/exceptions/**
            - lib/modules/**/domain/failures/**
            - lib/modules/**/infrastructure/exceptions/**
            - lib/core/infrastructure/annotations/**
            - lib/core/infrastructure/mappers/problem_mapper.g.dart

      # Swagger generator only processes files in input_folder
      swagger_dart_code_generator:
        options:
          input_folder: "./lib/api/swagger/"      # Downloaded Swagger JSON storage
          output_folder: "./lib/api/client/"      # Generated API client output
          input_urls:
            - url: "http://localhost:5025/swagger/v1/swagger.json"
              file_name: "api_116.json"
          separate_models: true                   # Generate models in separate files
          use_path_for_request_names: false       # Use operation IDs for method names
          multipart_file_type: "MultipartFile"    # Use MultipartFile for file uploads
      slang_build_runner:
        enabled: false # Disabled to run via separate command
            
