targets:
  $default:
    builders:
      swagger_dart_code_generator:
        options:
          input_folder: "./lib/api/swagger/"
          output_folder: "./lib/api/client/"
          input_urls:
            - url: "http://localhost:5025/swagger/v1/swagger.json"
              file_name: "api_116.json"
          separate_models: true
          use_path_for_request_names: false
            
